<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>

    <!-- Oppgave 1 -->
    <div class="container" id="container1">
        <h1>Oppgave 1</h1>

        <button id="Celcius">Fahrenheit to Celcius</button>    
        <p id="result1"></p>
    </div>

    <!-- Oppgave 2 -->
    <div class="container" id="container2">

        <input type="number" id="number2">
        <button onclick="comparison()">Compare the numbers</button>
        <p id="result2"></p>
    </div>

    <!-- Oppgave 3 -->

        <h1>Oppgave 3</h1>
        <input type="text" id="palinText">
        <button onclick="palindrome()">Is the text a palindrome?</button>
        <p id="result3"></p>
    </div>

    <!-- Oppgave 4 -->
    <div class="container" id="container4">
        <h1>Oppgave 4</h1>

        <button id="blue">Blue</button>
        <button id="randomColor">Random</button>

            <div class="theDivs" id="divEn"></div>
            <div class="theDivs" id="divTo"></div>
            <div class="theDivs" id="divTre"></div>
        </div>
    </div>

    <!-- Oppgave 5 -->
    <div class="container" id="container5">
        <h1>Oppgave 5</h1>
        <input type="number" id="height" placeholder="height">
        <input type="number" id="width" placeholder="width">
        <button id="starfish">Submit</button>
        <pre id="rektangel"></pre>
        </div>
    <script src="script.js"></script>
